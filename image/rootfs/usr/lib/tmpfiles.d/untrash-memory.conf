# Memory tiers (untrash-memd.c).  "-": no error on kernels without them.
# MGLRU: the working set of the last second is never evicted; under real
# shortage the OOM killer picks one process instead of the system thrashing.
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
# zswap pool: up to 25 % of RAM for compressed pages (kernel default 20)
w- /sys/module/zswap/parameters/max_pool_percent - - - - 25
